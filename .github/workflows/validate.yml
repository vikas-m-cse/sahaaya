name: Validate Sahaaya
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/volunteer-workflow-reliability"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test volunteer workflow
        run: npm run test:workflow
      - name: Build production site
        run: npm run build
