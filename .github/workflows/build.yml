name: Build

on:
  pull_request:
    branches: [sahaaya-world-class-ui, main]
  push:
    branches: [sahaaya-world-class-ui, main, feature/supabase-workflow-integration]

jobs:
  vite-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check JavaScript syntax
        run: find js api -name '*.js' -print0 | xargs -0 -n1 node --check
